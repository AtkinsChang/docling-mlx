name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      repository:
        description: Package index (pypi or testpypi)
        required: false
        default: pypi
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - if: inputs.tag != ''
        name: Check that the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: test "v$(uv version --short)" = "$TAG"
      - run: uv lock --check
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository == 'pypi' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: ${{ inputs.repository != 'pypi' }}
