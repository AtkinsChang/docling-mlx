name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # release-please names its branch after the target branch and the component;
      # its `pr` output is unset when it only updates an existing pull request.
      RELEASE_BRANCH: release-please--branches--main--components--docling-mlx
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but cannot edit uv.lock, and the pushes
      # and pull requests it makes with the workflow token start no workflow runs,
      # so refresh the lock on the release branch and run CI on it explicitly.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - if: steps.release.outputs.prs_created == 'true'
        name: Refresh the lockfile and run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh the lockfile for the release"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f repository=pypi -f tag="$TAG"
