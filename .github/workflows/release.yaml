name: Release

on:
  push:
    branches: [main]

# Two merges minutes apart start two runs that both rewrite the release branch;
# run them one after another so the second sees the first's lockfile commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # release-please names its branch after the target branch and the component;
      # its `pr` output is unset when it only updates an existing pull request.
      RELEASE_BRANCH: release-please--branches--main--components--docling-mlx
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but cannot edit uv.lock, and the pushes
      # and pull requests it makes with the workflow token start no workflow runs,
      # so refresh the lock on the release branch and run CI on it explicitly.
      # release-please only reports prs_created when it changed the pull request, so
      # gate on the branch itself: an open release branch always needs a current lock.
      - name: Find the release branch
        id: release-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/$RELEASE_BRANCH" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.release-branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - if: steps.release-branch.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - if: steps.release-branch.outputs.exists == 'true'
        name: Refresh the lockfile and approve CI on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh the lockfile for the release"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          # The pull_request run for a bot-authored pull request waits for approval, and
          # only that run's checks count for the pull request. Approve it once it appears.
          head="$(git rev-parse HEAD)"
          for _ in $(seq 1 12); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$RELEASE_BRANCH" \
              --event pull_request --limit 10 --json databaseId,headSha,conclusion)"
            pending="$(jq -r --arg sha "$head" \
              '.[] | select(.headSha == $sha and .conclusion == "action_required") | .databaseId' <<<"$runs" | head -n 1)"
            if [ -n "$pending" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$pending/approve" >/dev/null
              echo "approved run $pending for $head"
              exit 0
            fi
            if jq -e --arg sha "$head" '.[] | select(.headSha == $sha)' <<<"$runs" >/dev/null; then
              echo "run for $head already started"
              exit 0
            fi
            sleep 10
          done
          echo "no pull_request run appeared for $head" >&2
          exit 1

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f repository=pypi -f tag="$TAG"
