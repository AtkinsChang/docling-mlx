[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "docling-mlx"
version = "0.1.0"
description = "MLX model components and stage adapters for Docling"
authors = [{ name = "Atkins Chang" }]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["docling", "mlx", "apple-silicon", "document-ai", "layout-analysis", "table-structure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0 AND MIT"
license-files = [
  "LICENSE",
  "NOTICE",
  "LICENSES/Apache-2.0.txt",
  "LICENSES/MIT.txt",
]
dependencies = [
  "docling-slim[convert-core]>=2.124",
  "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "huggingface-hub>=1.29,<2",
  "numpy>=2.5,<3",
  "pillow>=12,<13",
  "pydantic>=2.13.4,<3",
  "safetensors>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/AtkinsChang/docling-mlx"
Repository = "https://github.com/AtkinsChang/docling-mlx"
Issues = "https://github.com/AtkinsChang/docling-mlx/issues"

[project.optional-dependencies]
tableformer-v1 = ["opencv-python>=5,<6"]
standard = ["docling>=2.124"]
vlm = ["docling[vlm]>=2.124"]

[project.entry-points."docling"]
docling_mlx = "docling_mlx.plugins"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<1",
  "mypy>=2.3.1,<3",
  "build>=1.5,<2",
  "docling-slim[format-pdf]",
]
reference = [
  "docling-ibm-models==4.0.1",
  "transformers==5.8.1",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "pypdfium2==5.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docling_mlx"]

[tool.hatch.build.targets.sdist]
include = [
  "src/docling_mlx",
  "tests",
  "tools",
  "docs",
  "examples",
  "README.md",
  "DEVELOPMENT.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  "NOTICE",
  "LICENSE",
  "LICENSES",
  "REUSE.toml",
  "pyproject.toml",
  "uv.lock",
]
exclude = [
  "**/__pycache__",
  ".artifacts",
  "reports",
  "docs/local",
  ".rumdl_cache",
  ".github",
  "flake.nix",
  "flake.lock",
  "treefmt.nix",
  ".envrc",
  ".claude",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.typos]
files.extend-exclude = [
  "uv.lock",
  ".artifacts",
  "reports",
  "docs/local",
  "tests/golden",
  "tests/fixtures",
  "LICENSES",
]

# D-FINE is a model name; typos splits identifiers into words, so allow the word form.
[tool.typos.default.extend-words]
dfine = "dfine"

[tool.typos.default.extend-identifiers]
# PaddleClas is the PaddlePaddle classification toolkit that publishes PP-HGNetV2.
PaddleClas = "PaddleClas"
PNGs = "PNGs"
PN = "PN"
BSE = "BSE"

[tool.mypy]
python_version = "3.13"
files = ["src", "tools", "examples"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Qualification lanes run via explicit -m selection.
addopts = ["--import-mode=importlib", "-m", "not (mlx or parity or release)"]
markers = [
  "parity: requires the pinned reference dependencies and converted model",
  "mlx: requires Apple Silicon and MLX",
  "release: Docling integration, upgrade qualification, and release evidence checks",
]
